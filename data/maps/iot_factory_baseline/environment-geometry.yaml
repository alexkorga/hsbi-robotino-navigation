    name: Northern building wall
    category: WALL
    points:
      - [-19.90, 6.40]
      - [0.85, 6.40]
      - [0.85, 6.53]
      - [-19.90, 6.53]

  - id: wall_east
    name: Eastern building wall
    category: WALL

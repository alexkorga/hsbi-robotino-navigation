# This is a deliberately clean, manually traced simulation layer in the same
# metre-based coordinate frame as navigation-map.pgm. It is not derived from
# every noisy occupancy pixel. Review and adjust it through the dashboard
# layers before using it as authoritative collision geometry.

# The southern annex below the thick red map marking is deliberately outside
# this polygon. The marking itself is not a wall and is not listed below as an
# obstacle. The western rooms/corridor and the upper strip behind the RASS
# machines remain navigable. The narrow south-eastern recess is also usable.
movement_area:
  points:
    - [-19.78, 6.35]
    - [0.68, 6.35]
    - [0.68, -5.70]
    - [-0.45, -5.70]
    - [-0.45, -4.19]
    - [-9.35, -4.19]
    - [-9.35, -3.65]
    - [-19.78, -3.65]

# All obstacle polygons are convex so the same definitions can later become
# Box2D fixtures. MACHINE denotes equipment footprints; WALL denotes only
# physical walls visible in the map.
obstacles:
